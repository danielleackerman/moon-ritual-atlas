.back-link,.icon-button{border:1px solid var(--line-strong);background:rgba(255,250,247,.66);min-width:42px;height:42px;border-radius:999px;display:inline-grid;place-items:center;text-decoration:none;cursor:pointer;transition:.22s var(--ease)}
.back-link:hover,.icon-button:hover{background:var(--surface-strong);border-color:var(--ink);transform:translateY(-1px)}
.back-link:focus-visible,.icon-button:focus-visible,.nav-button:focus-visible,.progress-dot:focus-visible,textarea:focus-visible{outline:3px solid rgba(110,133,122,.30);outline-offset:3px}
.back-link svg,.icon-button svg{width:18px;height:18px}.title-lockup{min-width:0;flex:1}
.eyebrow{font-family:var(--ff-ui);font-size:.63rem;font-weight:600;letter-spacing:.20em;text-transform:uppercase;color:var(--sage);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.actions{display:flex;gap:8px}.icon-button{width:auto;padding:0 13px;gap:7px;display:inline-flex;font-family:var(--ff-ui);font-size:.76rem}.icon-button span{white-space:nowrap}
.progress-wrap{position:relative;z-index:4;padding:13px clamp(18px,4vw,48px) 12px;background:rgba(242,228,222,.56);border-bottom:1px solid rgba(75,53,64,.08)}
.progress-track{display:flex;gap:8px;max-width:920px;margin:0 auto}.progress-dot{appearance:none;flex:1;height:4px;padding:0;border:0;border-radius:999px;background:rgba(75,53,64,.13);cursor:pointer;transition:.28s var(--ease)}

.scroll{position:relative;z-index:2;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(24px,5vw,58px) clamp(16px,4vw,48px) 150px;scroll-behavior:smooth}
.stage{width:min(900px,100%);margin:0 auto}.step-shell{position:relative}

.step-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.42),transparent 38%)}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step-grid{position:relative;display:grid;grid-template-columns:1fr;align-items:start}.step-copy{min-width:0}

.prose h3{font-family:var(--ff-display);font-size:1.35rem;font-weight:500;margin:28px 0 10px;color:var(--ink)}

.gather-list{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gather-list li{position:relative;padding:14px 15px 14px 42px;border:1px solid var(--line);border-radius:15px;background:rgba(255,252,250,.58);font-size:.95rem;line-height:1.46}

.journal textarea::placeholder{color:var(--faint)}.journal textarea:focus{border-color:var(--sage);background:rgba(255,253,251,.92)}.saved-flag{height:16px;margin-top:6px;font-family:var(--ff-ui);font-size:.64rem;letter-spacing:.06em;color:var(--faint)}

.integration{margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}.integration h3{font-family:var(--ff-ui);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin:0 0 9px}.integration p{margin:0;line-height:1.68}
.bottom-nav{position:absolute;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:18px clamp(16px,4vw,48px) calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(242,228,222,.99) 58%,rgba(242,228,222,.90));backdrop-filter:blur(16px)}
.nav-status{flex:1;text-align:center;font-family:var(--ff-ui);font-size:.71rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}.nav-button{border:1px solid var(--line-strong);border-radius:999px;background:rgba(255,250,247,.78);min-height:46px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--ff-ui);font-size:.84rem;font-weight:500;cursor:pointer;transition:.22s var(--ease)}
.nav-button:hover:not(:disabled){border-color:var(--ink);background:var(--surface-strong);transform:translateY(-1px)}.nav-button.primary{background:var(--ink);color:var(--paper-light);border-color:var(--ink)}.nav-button:disabled{opacity:.32;cursor:default}.nav-button svg{width:17px;height:17px}
.toast{position:fixed;z-index:20;left:50%;bottom:106px;transform:translate(-50%,18px);background:var(--ink);color:var(--paper-light);padding:11px 18px;border-radius:999px;font-family:var(--ff-ui);font-size:.77rem;opacity:0;pointer-events:none;transition:.28s var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.topbar{min-height:64px;padding:10px 13px;gap:10px}.icon-button{width:42px;padding:0;justify-content:center;align-items:center}.icon-button span{display:none}.progress-wrap{padding:10px 16px}.progress-track{gap:5px}.progress-dot{height:3px}.scroll{padding:22px 13px 132px}.step-card{border-radius:24px;padding:26px 20px 32px}.step-shell::before{inset:9px 12px -9px}.step-shell::after{inset:5px 6px -5px}.step-title{font-size:clamp(2.35rem,13vw,3.6rem);max-width:12ch;margin-bottom:18px}.gather-list{grid-template-columns:1fr}.bottom-nav{padding:13px 13px calc(13px + env(safe-area-inset-bottom));gap:8px}.nav-status{display:none}.nav-button{padding:0 17px;min-height:44px}.nav-button.primary{margin-left:auto}}
@media(max-width:420px){.title-lockup h1{font-size:1.08rem}.eyebrow{font-size:.57rem}.back-link,.icon-button{min-width:39px;height:39px}.nav-button{font-size:.79rem;padding:0 14px}.meta-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

<script>
const STORAGE_PREFIX="moon-ritual-atlas:v1:cancer:ritual-03:";
const memoryFallback=new Map();
const storage={get(key){try{return localStorage.getItem(STORAGE_PREFIX+key)}catch(_){return memoryFallback.get(key)??null}},set(key,value){try{localStorage.setItem(STORAGE_PREFIX+key,value)}catch(_){memoryFallback.set(key,value)}}};
const steps=[{"title": "The Unfinished <em>Letter</em>", "lede": "Give language to what remained emotionally suspended. The letter is not written to reopen the past or secure a response. It is written so your voice no longer has to remain trapped inside the unfinished scene.", "body": "<div class=\"prose\"><p>Mercury retrograde beside a Cancer New Moon returns language to memory. It may bring old conversations, missed messages, dreams of former people, or a strong awareness of what was never communicated.</p>\n<p>Cancer holds the past not as an archive but as living emotional material. Repeated internal conversations can become a private room in which the speaker is never heard and the scene never concludes.</p>\n<p>This ritual gives the unsent voice a body on paper. Sending is not the objective. Completion is.</p>\n</div><div class=\"meta-grid\"><div class=\"meta-item\"><span>Depth</span><strong>Inner Room</strong></div><div class=\"meta-item\"><span>Time</span><strong>30–60 minutes</strong></div><div class=\"meta-item\"><span>Mode</span><strong>Writing · Memory · Voice</strong></div><div class=\"meta-item\"><span>Best for</span><strong>words never said, conversations replayed internally, old messages, family silence, emotional truth that has remained suspended</strong></div></div>"}, {"title": "Gather the <em>elements</em>", "lede": "", "body": "<ul class=\"gather-list\">\n<li>Several sheets of unlined paper</li>\n<li>A pen that moves easily</li>\n<li>An envelope</li>\n<li>A bowl or glass of water</li>\n<li>A candle or low lamp</li>\n<li>Optional: a photograph or object associated with the person, place, or former self</li>\n</ul>\n"}, {"title": "Choose the <em>Recipient</em>", "lede": "", "body": "<div class=\"prose\"><p>The letter may be addressed to:</p>\n<ul>\n<li>a parent, sibling, former partner, friend, teacher, neighbor, or authority figure</li>\n<li>a house, city, church, workplace, or family system</li>\n<li>your childhood self</li>\n<li>the version of you who kept silent</li>\n<li>the person you became in order to survive the relationship</li>\n<li>someone who has died</li>\n<li>someone you do not intend to contact</li>\n</ul>\n<p>Choose the recipient whose name creates the clearest bodily response.</p>\n</div>"}, {"title": "Establish the Rule of the <em>Room</em>", "lede": "", "body": "<div class=\"prose\"><p>Place the water beside the paper. Light the candle or lamp and say:</p>\n<div class=\"incant\">\n<p>This letter does not exist to make me acceptable.<br />\nIt does not exist to make the other person understand.<br />\nIt exists to return my voice to me.</p>\n</div>\n<p>Write the date and the recipient’s name.</p>\n</div>"}, {"title": "Write the Four <em>Movements</em>", "lede": "", "body": "<div class=\"prose\"><p>Use these openings in order. Do not polish.</p>\n<h3>What I could not say then was…</h3>\n<p>Write the direct truth, including anger, grief, confusion, longing, disappointment, or love.</p>\n<h3>What I kept trying to make you understand was…</h3>\n<p>Name the recognition you were seeking.</p>\n<h3>What I understand now that I did not understand then is…</h3>\n<p>This may include your own role, the limits of the other person, the family pattern, the cost of waiting, or the difference between explanation and repair.</p>\n<h3>What no longer has to remain unfinished inside me is…</h3>\n<p>Name what the letter is closing: the argument, plea, fantasy, apology, justification, or need to receive the missing sentence from someone else.</p>\n</div>"}, {"title": "Find the Live <em>Line</em>", "lede": "", "body": "<div class=\"prose\"><p>Read the letter aloud privately. When your voice changes—tightens, breaks, slows, becomes louder, or becomes unusually calm—underline that sentence.</p>\n<p>That is the live line.</p>\n<p>Read it once more while touching the bowl of water.</p>\n<p>Then say:</p>\n<div class=\"incant\">\n<p>This sentence exists now.<br />\nIt has crossed from silence into form.<br />\nI do not have to carry it only in my body.</p>\n</div>\n</div>"}, {"title": "Choose the Letter’s Right <em>Ending</em>", "lede": "", "body": "<div class=\"prose\"><p>The ending should match the function of the letter.</p>\n<h3>Preserve</h3>\n<p>Place it in the envelope if the truth needs witness and continuity. Write on the envelope: <strong>This is what I know now.</strong></p>\n<h3>Release</h3>\n<p>Tear it into strips and soak them in water if the charge needs dissolution. Dispose of the softened paper appropriately.</p>\n<h3>Delay the Decision</h3>\n<p>Place the folded letter beneath the bowl overnight if you cannot yet tell whether it should be kept or released.</p>\n<h3>Transform</h3>\n<p>Copy only the live line onto a small card. Destroy the rest. Keep the essential sentence without keeping the whole scene.</p>\n</div>"}, {"title": "Journal <em>prompts</em>", "lede": "", "body": "<div class=\"prompt-grid\"><div class=\"journal\">\n          <label for=\"note-journal-03-1\">What response did I spend years imagining?</label>\n          <textarea id=\"note-journal-03-1\" data-note=\"journal-03-1\" placeholder=\"\"></textarea>\n          <div class=\"saved-flag\" id=\"saved-journal-03-1\"></div>\n        </div><div class=\"journal\">\n          <label for=\"note-journal-03-2\">What part of my life has remained organized around waiting for it?</label>\n          <textarea id=\"note-journal-03-2\" data-note=\"journal-03-2\" placeholder=\"\"></textarea>\n          <div class=\"saved-flag\" id=\"saved-journal-03-2\"></div>\n        </div><div class=\"journal\">\n          <label for=\"note-journal-03-3\">What becomes possible when my truth no longer depends on being agreed with?</label>\n          <textarea id=\"note-journal-03-3\" data-note=\"journal-03-3\" placeholder=\"\"></textarea>\n          <div class=\"saved-flag\" id=\"saved-journal-03-3\"></div>\n        </div><div class=\"journal\">\n          <label for=\"note-journal-03-4\">Is there an apology I owe myself for how long I required my silence?</label>\n          <textarea id=\"note-journal-03-4\" data-note=\"journal-03-4\" placeholder=\"\"></textarea>\n          <div class=\"saved-flag\" id=\"saved-journal-03-4\"></div>\n        </div></div>"}, {"title": "Closing <em>words</em>", "lede": "", "body": "<div class=\"prose\"><div class=\"incant\">\n<p>I do not send my voice backward in time to beg for a different past.<br />\nI bring my voice home.<br />\nThe sentence has been spoken.<br />\nThe room no longer has to repeat it for me.</p>\n</div>\n</div><div class=\"prose\"><p>Save the live line:</p>\n</div><div class=\"tide-mark\"><div class=\"journal\"><label for=\"note-tide-mark\">What I could not say then was…</label>\n          <textarea id=\"note-tide-mark\" data-note=\"tide-mark\" placeholder=\"\"></textarea>\n          <div class=\"saved-flag\" id=\"saved-tide-mark\"></div></div></div><div class=\"integration\"><h3>Lunar-cycle integration</h3><p>For the next fourteen days, notice when the old conversation restarts internally. Do not argue inside it. Say: <strong>The letter has already been written. What does the present require?</strong></p>\n<hr />\n</div>"}];
const noteDefinitions=[{"id": "journal-03-1", "label": "What response did I spend years imagining?"}, {"id": "journal-03-2", "label": "What part of my life has remained organized around waiting for it?"}, {"id": "journal-03-3", "label": "What becomes possible when my truth no longer depends on being agreed with?"}, {"id": "journal-03-4", "label": "Is there an apology I owe myself for how long I required my silence?"}, {"id": "tide-mark", "label": "What I could not say then was…"}];
let currentStep=clamp(Number(storage.get('progress'))||0,0,steps.length-1);let saveTimers=new Map();
const card=document.getElementById('stepCard'),scrollRegion=document.getElementById('scrollRegion'),progressTrack=document.getElementById('progressTrack'),prevButton=document.getElementById('prevButton'),nextButton=document.getElementById('nextButton'),navStatus=document.getElementById('navStatus'),toast=document.getElementById('toast');
function clamp(value,min,max){return Math.min(Math.max(value,min),max)}
function stripHTML(value){const temp=document.createElement('div');temp.innerHTML=value;return temp.textContent||''}
function renderProgress(){progressTrack.innerHTML=steps.map((_,index)=>`<button class="progress-dot ${index<currentStep?'done':''} ${index===currentStep?'current':''}" type="button" data-step="${index}" aria-label="Go to step ${index+1}: ${stripHTML(steps[index].title)}" ${index===currentStep?'aria-current="step"':''}></button>`).join('');progressTrack.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>goToStep(Number(button.dataset.step))))}
function renderStep(){const step=steps[currentStep];card.innerHTML=`<div class="step-grid"><div class="step-copy"><div class="step-count">Step ${String(currentStep+1).padStart(2,'0')} of ${String(steps.length).padStart(2,'0')}</div><h2 class="step-title">${step.title}</h2>${step.lede?`<p class="lede">${step.lede}</p>`:''}${step.body}</div></div>`;restoreNotes();bindNotes();renderProgress();prevButton.disabled=currentStep===0;navStatus.textContent=`Step ${currentStep+1} of ${steps.length}`;nextButton.querySelector('span').textContent=currentStep===steps.length-1?'Return to index':'Continue';storage.set('progress',String(currentStep));scrollRegion.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function goToStep(index){currentStep=clamp(index,0,steps.length-1);renderStep()}
function restoreNotes(){card.querySelectorAll('[data-note]').forEach(field=>{field.value=storage.get('note:'+field.dataset.note)||''})}
function bindNotes(){card.querySelectorAll('[data-note]').forEach(field=>{field.addEventListener('input',()=>{const key=field.dataset.note;storage.set('note:'+key,field.value);const flag=document.getElementById('saved-'+key);if(flag)flag.textContent='Saving…';clearTimeout(saveTimers.get(key));saveTimers.set(key,setTimeout(()=>{if(flag)flag.textContent='Saved in this browser'},350))})})}
function collectNotes(){const fields=noteDefinitions.map(item=>[item.label,storage.get('note:'+item.id)]).filter(([,value])=>value&&value.trim());const lines=["The Unfinished Letter",'New Moon in Cancer · Ritual 03',''];if(!fields.length)lines.push('No notes have been written yet.');fields.forEach(([label,value])=>lines.push(label+'\n'+value.trim()+'\n'));return lines.join('\n')}
async function copyNotes(){const text=collectNotes();try{await navigator.clipboard.writeText(text);showToast('Notes copied')}catch(_){const helper=document.createElement('textarea');helper.value=text;document.body.appendChild(helper);helper.select();document.execCommand('copy');helper.remove();showToast('Notes copied')}}
function exportNotes(){const blob=new Blob([collectNotes()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download="the-unfinished-letter-notes.txt";document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);showToast('Notes exported')}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
async function loadExactPaperTexture(){try{const response=await fetch('../index.html',{cache:'force-cache'});if(!response.ok)return;const html=await response.text(),match=html.match(/--paper-tex\s*:\s*(url\('data:image\/jpeg;base64,[^']+'\))/);if(match)document.documentElement.style.setProperty('--paper-tex',match[1])}catch(_){}}
prevButton.addEventListener('click',()=>goToStep(currentStep-1));nextButton.addEventListener('click',()=>{if(currentStep===steps.length-1){window.location.href='../index.html#index';return}goToStep(currentStep+1)});document.getElementById('copyNotes').addEventListener('click',copyNotes);document.getElementById('exportNotes').addEventListener('click',exportNotes);window.addEventListener('keydown',event=>{const active=document.activeElement;if(active&&(active.tagName==='TEXTAREA'||active.tagName==='INPUT'))return;if(event.key==='ArrowRight'&&currentStep<steps.length-1){event.preventDefault();goToStep(currentStep+1)}if(event.key==='ArrowLeft'&&currentStep>0){event.preventDefault();goToStep(currentStep-1)}if(event.key==='Escape')window.location.href='../index.html#index'});loadExactPaperTexture();renderStep();
</script></body></html>
