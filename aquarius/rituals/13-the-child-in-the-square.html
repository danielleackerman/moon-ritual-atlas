<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Child in the Square — Moon Ritual Atlas</title>
  <meta name="description" content="The Thirteenth of the Aquarius room: an eight-card ritual for recovering the sovereign creative heart by making one thing that reception cannot judge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Daylight observatory: near-neutral pale stone, a breath of warmth, never beige, never blue. */
      --field: #e4e3e0;
      --field-high: #edecea;

      /* Paper, kept for the resting cover. */
      --vellum: rgba(246, 245, 242, .94);
      --ink: #1c242a;
      --ink-soft: #566068;
      --silver: #9ea8b1;
      --rule: rgba(28, 36, 42, .1);
      --edge: rgba(28, 36, 42, .16);

      /* Index gold, adapted for a light ground. Rationed — here it is the warmth the square earns as you create. */
      --gold: #b9782f;
      --gilt: #8d642f;
      --gold-wash: rgba(185, 120, 47, .07);

      --display: "Newsreader", Georgia, serif;
      --atlas: "Spectral", Georgia, serif;
      --ui: "Instrument Sans", system-ui, sans-serif;

      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      color: var(--ink);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      /* The chart the square is drawn on: a fine graphite drafting grid. */
      background:
        repeating-linear-gradient(0deg, rgba(28, 36, 42, .05) 0 1px, transparent 1px 132px),
        repeating-linear-gradient(90deg, rgba(28, 36, 42, .05) 0 1px, transparent 1px 132px),
        repeating-linear-gradient(0deg, rgba(28, 36, 42, .022) 0 1px, transparent 1px 33px),
        repeating-linear-gradient(90deg, rgba(28, 36, 42, .022) 0 1px, transparent 1px 33px),
        radial-gradient(circle at 78% -8%, rgba(255, 255, 255, .6), transparent 34rem),
        radial-gradient(ellipse at 16% 114%, rgba(185, 120, 47, .05), transparent 40rem),
        var(--field);
    }

    .ritual-reader {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100dvh;
    }

    /* ============================================================
       Header — one thin strip. (Same chrome as the twelve.)
       ============================================================ */
    .reader-header {
      z-index: 6;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      height: 56px;
      padding: 0 clamp(14px, 3vw, 34px);
      border-bottom: 1px solid var(--rule);
      background: rgba(237, 236, 234, .86);
      backdrop-filter: blur(12px);
    }

    .reader-exit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin-left: -8px;
      border-radius: 50%;
      color: var(--ink-soft);
      text-decoration: none;
      transition: color .2s ease, background-color .2s ease;
    }

    .reader-exit:hover,
    .reader-exit:focus-visible {
      color: var(--ink);
      background: rgba(28, 36, 42, .06);
    }

    .reader-exit svg { width: 19px; height: 19px; }

    .reader-identity {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
    }

    .reader-kicker {
      margin: 0;
      color: var(--ink-soft);
      font-size: .63rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .reader-title {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
      font-family: var(--atlas);
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: .01em;
    }

    .reader-tools { display: flex; gap: 6px; }

    .reader-tool {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--ink-soft);
      background: none;
      font-family: var(--ui);
      font-size: .73rem;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }

    .reader-tool:hover,
    .reader-tool:focus-visible {
      color: var(--ink);
      border-color: var(--edge);
    }

    .reader-tool svg { width: 15px; height: 15px; flex: none; }

    /* ============================================================
       Stage — the marked square. No deck, no progress: the
       Thirteenth is not a ranked sequence. One room you enter.
       ============================================================ */
    .reader-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: clamp(20px, 4vh, 54px) clamp(16px, 4vw, 48px);
    }

    .square {
      position: relative;
      width: min(680px, 100%);
      aspect-ratio: 1 / 1;   /* graceful default; JS refines to an exact square for the stage */
      max-height: 100%;
      isolation: isolate;
    }

    /* The boundary, drawn in the atlas's own line language: a fine
       graphite stroke on the chart, gilded by the timer as you make. */
    .square-line {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 0;
    }

    .line-base {
      fill: none;
      stroke: rgba(28, 36, 42, .2);
      stroke-width: 1;
      transition: stroke .5s ease;
    }

    .line-travel {
      fill: none;
      stroke: url(#giltTravel);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;      /* hidden until a round begins */
      filter: drop-shadow(0 0 3px rgba(185, 120, 47, .45));
      transition: stroke-dashoffset .18s linear;
    }

    .square.timer-complete .line-base { stroke: rgba(185, 120, 47, .55); }

    /* Corner marks — kin to the gilt pin on the twelve. */
    .square-corner {
      position: absolute;
      z-index: 1;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gilt);
      box-shadow: 0 0 0 4px rgba(141, 100, 47, .1), 0 1px 3px rgba(28, 36, 42, .3);
      opacity: .55;
      transition: opacity .45s ease, box-shadow .45s ease, background-color .45s ease;
    }

    .square.timer-running .square-corner,
    .square.timer-complete .square-corner {
      opacity: 1;
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(185, 120, 47, .14), 0 0 15px 2px rgba(185, 120, 47, .4);
    }

    .square-corner.tl { top: -4.5px; left: -4.5px; }
    .square-corner.tr { top: -4.5px; right: -4.5px; }
    .square-corner.br { bottom: -4.5px; right: -4.5px; }
    .square-corner.bl { bottom: -4.5px; left: -4.5px; }

    /* You move within the square; its content scrolls, the boundary stays. */
    .square-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: clamp(24px, 4.4vw, 46px);
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 36, 42, .25) transparent;
      transition: opacity .26s var(--ease), transform .26s var(--ease);
    }

    .square-content.is-leaving { opacity: 0; transform: translateY(6px); }

    /* The protective close: the work is covered, not published. */
    .square-cover {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      background:
        linear-gradient(152deg, rgba(255, 255, 255, .5), transparent 44%),
        var(--vellum);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      transition: opacity .8s ease;
    }

    .square.resting .square-cover { opacity: 1; pointer-events: auto; }
    .square.resting .square-content { opacity: .1; }

    .square-cover p {
      max-width: 24ch;
      margin: 0;
      color: var(--ink-soft);
      font-family: var(--display);
      font-style: italic;
      font-size: clamp(1.1rem, 2.4vw, 1.32rem);
      line-height: 1.5;
    }

    /* ------------------------------------------------------------
       Within-square typography (same faces & rhythm as the twelve).
       ------------------------------------------------------------ */
    .card-number {
      margin: 0 0 16px;
      color: var(--ink-soft);
      font-size: .64rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .card-number strong { color: var(--gilt); font-weight: 600; }

    .card-title {
      margin: 0;
      max-width: 16ch;
      color: var(--ink);
      font-family: var(--display);
      font-size: clamp(1.9rem, 4.6vw, 2.7rem);
      font-weight: 300;
      letter-spacing: -.02em;
      line-height: 1.03;
    }

    .title-sheet .card-title {
      max-width: 13ch;
      font-size: clamp(2.5rem, 7vw, 3.9rem);
      line-height: .99;
      letter-spacing: -.025em;
    }

    .sheet-transformation {
      margin: .8em 0 0;
      color: var(--ink-soft);
      font-family: var(--display);
      font-size: clamp(1.08rem, 2.3vw, 1.3rem);
      font-style: italic;
      font-weight: 300;
      line-height: 1.4;
    }

    .sheet-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 30px;
      margin-top: clamp(20px, 3.4vw, 30px);
      padding-top: 18px;
      border-top: 1px solid var(--rule);
    }

    .sheet-meta p { margin: 0; display: grid; gap: 4px; }

    .sheet-meta .meta-label {
      color: var(--ink-soft);
      font-size: .59rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .sheet-meta .meta-value {
      color: var(--ink);
      font-family: var(--display);
      font-size: .97rem;
    }

    .ritual-copy { margin-top: clamp(20px, 3.4vw, 32px); }

    .ritual-copy p {
      margin: .8em 0;
      color: rgba(28, 36, 42, .88);
      font-family: var(--display);
      font-size: clamp(1.04rem, 2vw, 1.15rem);
      line-height: 1.76;
    }

    .ritual-copy ul,
    .ritual-copy ol {
      margin: .8em 0;
      padding-left: 1.25em;
      color: rgba(28, 36, 42, .88);
      font-family: var(--display);
      font-size: clamp(1.04rem, 2vw, 1.15rem);
      line-height: 1.66;
    }

    .ritual-copy li { margin: .28em 0; }
    .ritual-copy li::marker { color: var(--silver); }
    .ritual-copy ol li::marker { color: var(--gilt); font-weight: 500; }

    .ritual-copy blockquote {
      margin: 1.3em 0;
      padding: .1em 0 .1em 1.1em;
      border-left: 2px solid var(--gilt);
    }

    .ritual-copy blockquote p {
      margin: .38em 0;
      color: var(--ink);
      font-size: clamp(1.12rem, 2.2vw, 1.26rem);
      font-style: italic;
      font-weight: 300;
      line-height: 1.58;
    }

    .ritual-copy blockquote strong { font-style: italic; font-weight: 400; }
    .ritual-copy strong { font-weight: 500; }

    .ritual-copy h2 {
      margin: 2em 0 .5em;
      padding-top: 1.1em;
      border-top: 1px solid var(--rule);
      color: var(--gilt);
      font-family: var(--ui);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .begin-ritual {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
      margin-top: clamp(26px, 4vw, 36px);
      padding: 0 28px;
      border: 1px solid rgba(141, 100, 47, .55);
      border-radius: 999px;
      color: var(--gilt);
      background: var(--gold-wash);
      font-family: var(--ui);
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background-color .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .begin-ritual:hover,
    .begin-ritual:focus-visible {
      background: rgba(185, 120, 47, .13);
      box-shadow: 0 6px 22px -10px rgba(141, 100, 47, .5);
      transform: translateY(-1px);
    }

    .begin-ritual svg { width: 16px; height: 16px; }

    /* ------------------------------------------------------------
       Timer — the two thirteen-minute rounds, fused to the square.
       Ambient, not a countdown: it gilds the boundary as you make.
       ------------------------------------------------------------ */
    .timer {
      margin-top: clamp(24px, 3.6vw, 34px);
      padding-top: 20px;
      border-top: 1px solid var(--rule);
    }

    .timer-lead {
      margin: 0 0 14px;
      color: var(--ink-soft);
      font-family: var(--display);
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.5;
    }

    .timer-row {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .timer-choices { display: flex; gap: 10px; flex-wrap: wrap; }

    .timer-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 22px;
      border: 1px solid rgba(141, 100, 47, .55);
      border-radius: 999px;
      color: var(--gilt);
      background: var(--gold-wash);
      font-family: var(--ui);
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background-color .25s ease, box-shadow .25s ease;
    }

    .timer-btn:hover,
    .timer-btn:focus-visible {
      background: rgba(185, 120, 47, .13);
      box-shadow: 0 6px 20px -10px rgba(141, 100, 47, .5);
    }

    .timer-readout {
      font-family: var(--display);
      font-variant-numeric: tabular-nums;
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--ink-soft);
      letter-spacing: .02em;
      min-width: 3.4ch;
    }

    .timer-reset {
      border: 0;
      background: none;
      color: var(--ink-soft);
      font-family: var(--ui);
      font-size: .72rem;
      letter-spacing: .06em;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .timer-reset:hover,
    .timer-reset:focus-visible { color: var(--ink); }

    .timer-note {
      min-height: 15px;
      margin: 12px 0 0;
      color: var(--gilt);
      font-family: var(--ui);
      font-size: .72rem;
      letter-spacing: .05em;
    }

    /* ------------------------------------------------------------
       Journal — an optional drawer, closed by default.
       ------------------------------------------------------------ */
    .journal {
      margin-top: clamp(24px, 3.6vw, 34px);
      border-top: 1px solid var(--rule);
    }

    .journal summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      color: var(--ink-soft);
      font-family: var(--ui);
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .06em;
      cursor: pointer;
      list-style: none;
      transition: color .2s ease;
    }

    .journal summary::-webkit-details-marker { display: none; }

    .journal summary:hover,
    .journal summary:focus-visible { color: var(--ink); }

    .journal summary svg {
      width: 14px;
      height: 14px;
      flex: none;
      transition: transform .25s var(--ease);
    }

    .journal[open] summary svg { transform: rotate(90deg); }

    .journal-fields {
      display: grid;
      gap: 20px;
      padding: 4px 0 10px;
    }

    .journal-field label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.06rem;
      font-style: italic;
    }

    .journal-field textarea {
      width: 100%;
      min-height: 92px;
      padding: 13px 14px;
      border: 1px solid rgba(28, 36, 42, .22);
      border-radius: 2px;
      resize: vertical;
      color: var(--ink);
      background:
        repeating-linear-gradient(180deg, transparent 0 30px, rgba(28, 36, 42, .07) 30px 31px),
        rgba(255, 255, 255, .6);
      font-family: var(--display);
      font-size: 1.02rem;
      line-height: 1.65;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .journal-field textarea:focus {
      outline: none;
      border-color: var(--gilt);
      box-shadow: 0 0 0 1px var(--gilt);
    }

    .saved-note {
      min-height: 15px;
      margin: 6px 0 0;
      color: var(--gilt);
      font-family: var(--ui);
      font-size: .67rem;
      letter-spacing: .05em;
    }

    /* ============================================================
       Footer navigation
       ============================================================ */
    .reader-footer {
      z-index: 6;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 12px clamp(14px, 3vw, 34px);
      border-top: 1px solid var(--rule);
      background: rgba(237, 236, 234, .88);
      backdrop-filter: blur(12px);
    }

    .card-nav {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 22px;
      border: 1px solid rgba(28, 36, 42, .24);
      border-radius: 999px;
      color: var(--ink);
      background: none;
      font-family: var(--ui);
      font-size: .87rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .2s ease, background-color .25s ease, box-shadow .25s ease;
    }

    .card-nav:hover:not(:disabled),
    .card-nav:focus-visible { border-color: var(--ink); }

    .card-nav.next {
      border-color: rgba(141, 100, 47, .55);
      color: var(--gilt);
      background: var(--gold-wash);
    }

    .card-nav.next:hover,
    .card-nav.next:focus-visible {
      background: rgba(185, 120, 47, .13);
      box-shadow: 0 6px 20px -10px rgba(141, 100, 47, .5);
    }

    .card-nav:disabled { opacity: .3; pointer-events: none; }
    .card-nav svg { width: 15px; height: 15px; }

    .reader-status {
      margin: 0;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: .68rem;
      letter-spacing: .16em;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 86px;
      left: 50%;
      z-index: 20;
      padding: 11px 20px;
      border: 1px solid rgba(141, 100, 47, .4);
      border-radius: 999px;
      color: var(--field-high);
      background: rgba(28, 36, 42, .95);
      font-size: .8rem;
      letter-spacing: .03em;
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    [hidden] { display: none !important; }

    /* Responsive */
    @media (max-width: 720px) {
      .reader-header { height: 52px; gap: 10px; }
      .reader-kicker { display: none; }
      .reader-tool span { display: none; }
      .reader-tool { width: 40px; padding: 0; justify-content: center; }

      .reader-stage { padding: clamp(14px, 3vh, 28px) clamp(12px, 4vw, 24px); }

      .sheet-meta { gap: 10px 22px; }

      .reader-footer { padding: 10px 14px; }
      .reader-status { font-size: .6rem; }
      .card-nav { padding: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="ritual-reader">
    <header class="reader-header">
      <a class="reader-exit" href="../index.html" aria-label="Return to the Aquarius index">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 12H5m6 6-6-6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <div class="reader-identity">
        <p class="reader-kicker">Full Moon in Aquarius · The Thirteenth</p>
        <p class="reader-title">The Child in the Square</p>
      </div>

      <div class="reader-tools">
        <button class="reader-tool" id="copyNotes" type="button" aria-label="Copy ritual notes">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h8" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>Copy notes</span>
        </button>
        <button class="reader-tool" id="exportNotes" type="button" aria-label="Export ritual notes">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Export</span>
        </button>
      </div>
    </header>

    <section class="reader-stage" aria-label="The marked square">
      <div class="square" id="square">
        <svg class="square-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="giltTravel" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8d642f"/>
              <stop offset="0.55" stop-color="#b9782f"/>
              <stop offset="1" stop-color="#c88a3e"/>
            </linearGradient>

  <template id="title-sheet">
    <p class="card-number">Full Moon in Aquarius · Outside the Movements</p>
    <h1 class="card-title">The Child in the Square</h1>
    <p class="sheet-transformation">The self ceases to be only a participant, signal, function, or node and becomes an uncalculated source of life.</p>

    <div class="sheet-meta">
      <p><span class="meta-label">Estimated time</span><span class="meta-value">35–60 minutes</span></p>
      <p><span class="meta-label">Intensity</span><span class="meta-value">Gentle, exposed, alive</span></p>
      <p><span class="meta-label">Entry</span><span class="meta-value">Always available</span></p>
    </div>

    <div class="ritual-copy">
      <h2>Purpose</h2>
      <p>Recover the sovereign creative heart by making one thing that is not required to inform, persuade, serve, prove, perform, improve, or become useful to the collective.</p>
      <p><strong>Result:</strong> One complete-enough act of creative joy whose worth is not tested through usefulness, ranking, explanation, or immediate reception.</p>

      <h2>Source foundation</h2>
      <p>In <em>The Emperor’s New Clothes</em>, the child in the square is not the most powerful, educated, strategic, or sophisticated person present. She is the person who has not yet learned to exchange the evidence of her own eyes for the safety of belonging to the crowd.</p>
      <p>That child first entered the journey through perception. Here, after the twelve Aquarian rituals are complete, she returns through creation.</p>
      <p>The Leo Sun–Jupiter conjunction represents creativity, courage, presence, joy, inherent value, and the living center of the individual. Its medicine is not applause. The sources distinguish creative expression from the need to make expression acceptable, profitable, perfect, socially legible, or useful for advancement. The creative impulse is alive before it is evaluated.</p>
      <p>Aquarius remains necessary. The twelve rituals have restored conscious participation in groups, relationships, systems, media, and the future. But a person who exists only through contribution is still governed by the collective. The Thirteenth protects the part of the self that can create before the network assigns a function to what has been made.</p>
      <p>This ritual is not anti-audience, anti-community, anti-discipline, or anti-craft. Work may later be refined, shared, performed, sold, taught, gifted, or brought into service. The condition is simpler:</p>
      <blockquote>
        <p><strong>For the duration of the ritual, reception cannot determine existence.</strong></p>
      </blockquote>

      <h2>Materials</h2>
      <ul>
        <li>Masking tape, string, ribbon, chalk, four objects, or another simple way to mark a square</li>
        <li>Thirteen minutes on a timer, with the alarm sound chosen in advance</li>
        <li>One creative medium that can be used immediately</li>
        <li>Any basic materials that medium requires</li>
        <li>One blank card and a pen</li>
        <li>A cloth, envelope, folder, box, closed drawer, or other place where the finished act can rest unseen</li>
        <li>Optional: the artifact from Ritual 03, <strong>Real Gold / Invisible Gold</strong></li>
        <li>Optional: the completion evidence from Ritual 12, <strong>The Signal Sent</strong></li>
      </ul>
      <p>The medium may be:</p>
      <ul>
        <li>voice,</li>
        <li>rhythm,</li>
        <li>movement,</li>
        <li>drawing,</li>
        <li>color,</li>
        <li>collage,</li>
        <li>clay,</li>
        <li>fabric,</li>
        <li>dress,</li>
        <li>arrangement,</li>
        <li>story,</li>
        <li>poetry,</li>
        <li>prayer,</li>
        <li>food,</li>
        <li>flowers,</li>
        <li>found objects,</li>
        <li>sound,</li>
        <li>image,</li>
        <li>or another form that allows something alive to take form.</li>
      </ul>
      <p>Choose a medium available now. Do not turn material selection into a search for the ideal project.</p>

      <h2>The gate</h2>
      <p>The participant is ready to leave the four movements when they can complete:</p>
      <blockquote>
        <p><strong>What I have given the shared world is ______. What I am now ready to make without asking the shared world to need, reward, rank, or understand it is ______.</strong></p>
      </blockquote>
      <p>The first blank honors contribution.</p>
      <p>The second breaks contribution’s rule.</p>
      <p>Do not enter the Thirteenth by asking:</p>
      <ul>
        <li>What should I post next?</li>
        <li>What would be most useful?</li>
        <li>What fits the strategy?</li>
        <li>What will prove I have changed?</li>
        <li>What will perform well?</li>
        <li>What does the group need from me?</li>
      </ul>
      <p>The Thirteenth begins where the signal no longer needs a destination.</p>
      <p>It belongs to the sovereign creative heart.</p>

      <h2>Opening threshold</h2>
      <p>If you have completed Ritual 12, place its evidence outside the area where you will work. Say:</p>
      <blockquote>
        <p><strong>I have contributed. The shared world has received what I chose to send.</strong></p>
      </blockquote>
      <p>If you have not completed the twelve, enter directly. The Thirteenth is always accessible because the creative heart is not a prize awarded for successful completion.</p>
      <p>Silence notifications. Close feeds, analytics, messages, reference boards, tutorials, and any window through which an audience can enter before the work exists.</p>
      <p>This is not a vow of permanent privacy. It is a temporary removal of reception from the act of creation.</p>
      <p>Complete:</p>
      <blockquote>
        <p><strong>For this hour, nothing I make has to leave this room.</strong></p>
      </blockquote>
      <p>Then begin.</p>
    </div>

  <script>
    (() => {
      const cards = [
        { title: "Dismiss the Invisible Audience" },
        { title: "Mark the Square" },
        { title: "Find the Living Spark" },
        { title: "Make Before Taste Can Vote", timer: 780 },
        { title: "Follow Aliveness", timer: 780 },
        { title: "Leave One Thing Uncorrected" },

        { title: "Protect the Source" }
      ];

      const total = cards.length;
      const pad = (n) => String(n).padStart(2, "0");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const square = document.getElementById("square");
      const content = document.getElementById("cardContent");
      const cover = document.getElementById("squareCover");
      const lineTravel = document.getElementById("lineTravel");
      const previous = document.getElementById("previousCard");
      const next = document.getElementById("nextCard");
      const status = document.getElementById("readerStatus");
      const toast = document.getElementById("toast");
      const notes = {};
      let current = -1; /* -1 = threshold */
      let animating = false;
      let toastTimer;

      /* ---- the square is a true square, sized to its stage ---- */
      function sizeSquare() {
        const stage = square.parentElement;
        const cs = getComputedStyle(stage);
        const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const size = Math.max(240, Math.min(680, availW, availH));
        square.style.width = size + "px";
        square.style.height = size + "px";
      }

      /* ---- private notes storage, with in-memory fallback ---- */
      const storage = {
        get(key) {
          try { return window.localStorage.getItem(key) || ""; }
          catch (_) { return notes[key] || ""; }
        },
        set(key, value) {
          notes[key] = value;
          try { window.localStorage.setItem(key, value); } catch (_) {}
        }
      };

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      /* ============================================================
         The timer, fused to the square's boundary.
         Elapsing minutes gild the perimeter; the readout is quiet.
         ============================================================ */
      let timerRAF = null;
      let timerState = null;

      function setReadout(el, seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        el.textContent = `${m}:${String(s).padStart(2, "0")}`;
      }

      function resetBoundary() {
        square.classList.remove("timer-running", "timer-complete");
        lineTravel.style.transition = "stroke-dashoffset .35s ease";
        lineTravel.style.strokeDashoffset = "1000";
      }

      function stopTimer() {
        if (timerRAF) window.cancelAnimationFrame(timerRAF);
        timerRAF = null;
        timerState = null;
      }

      function chime(duration) {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          const ctx = new Ctx();
          const now = ctx.currentTime;
          [[660, 0], [990, 0.2]].forEach(([freq, offset]) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, now + offset);
            gain.gain.linearRampToValueAtTime(0.08, now + offset + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + offset + 1.2);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 1.3);
          });
        } catch (_) {}
      }

      function tick(now, duration, readout, note, toggle) {
        if (!timerState || !timerState.running) return;
        const elapsed = (now - timerState.startedAt) / 1000 + timerState.elapsedBefore;
        const remaining = Math.max(0, duration - elapsed);
        const fraction = Math.min(1, elapsed / duration);
        lineTravel.style.strokeDashoffset = String(1000 * (1 - fraction));
        setReadout(readout, remaining);
        if (remaining <= 0) {
          timerState.running = false;
          square.classList.remove("timer-running");
          square.classList.add("timer-complete");
          note.textContent = duration === 780
            ? "The thirteen minutes are complete."
            : "The round is complete.";
          toggle.textContent = "Begin again";
          toggle.dataset.mode = "idle";
          chime(duration);
          return;
        }
        timerRAF = window.requestAnimationFrame((t) => tick(t, duration, readout, note, toggle));
      }

      function startRun(duration, readout, note, toggle) {
        stopTimer();
        square.classList.remove("timer-complete");
        square.classList.add("timer-running");
        lineTravel.style.transition = "stroke-dashoffset .18s linear";
        timerState = { duration, startedAt: performance.now(), elapsedBefore: 0, running: true };
        timerRAF = window.requestAnimationFrame((t) => tick(t, duration, readout, note, toggle));
      }

      function buildTimer(card) {
        const wrap = document.createElement("div");
        wrap.className = "timer";

        const readout = document.createElement("span");
        readout.className = "timer-readout";
        const note = document.createElement("p");
        note.className = "timer-note";
        note.setAttribute("aria-live", "polite");

        const row = document.createElement("div");
        row.className = "timer-row";

        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "timer-reset";
        reset.textContent = "Reset";
        reset.hidden = true;

        function attachToggle(duration, label) {
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "timer-btn";
          toggle.dataset.mode = "idle";
          toggle.textContent = label;
          toggle.addEventListener("click", () => {
            const mode = toggle.dataset.mode;
            if (mode === "idle") {
              startRun(duration, readout, note, toggle);
              toggle.textContent = "Pause";
              toggle.dataset.mode = "running";
              note.textContent = "";
              reset.hidden = false;
            } else if (mode === "running") {
              // pause
              if (timerRAF) window.cancelAnimationFrame(timerRAF);
              timerRAF = null;
              if (timerState) {
                timerState.elapsedBefore += (performance.now() - timerState.startedAt) / 1000;
                timerState.running = false;
              }
              toggle.textContent = "Resume";
              toggle.dataset.mode = "paused";
            } else if (mode === "paused") {
              // resume
              square.classList.add("timer-running");
              if (timerState) {
                timerState.startedAt = performance.now();
                timerState.running = true;
              } else {
                startRun(duration, readout, note, toggle);
              }
              timerRAF = window.requestAnimationFrame((t) => tick(t, duration, readout, note, toggle));
              toggle.textContent = "Pause";
              toggle.dataset.mode = "running";
            }
          });
          return toggle;
        }

        if (card.timer) {
          setReadout(readout, card.timer);
          const toggle = attachToggle(card.timer, "Begin the thirteen minutes");
          row.append(toggle, readout, reset);
          reset.addEventListener("click", () => {
            stopTimer();
            resetBoundary();
            setReadout(readout, card.timer);
            note.textContent = "";
            toggle.textContent = "Begin the thirteen minutes";
            toggle.dataset.mode = "idle";
            reset.hidden = true;
          });
          wrap.append(row, note);
        } else {
          // optional final round: 5 or 13 minutes
          const lead = document.createElement("p");
          lead.className = "timer-lead";
          lead.textContent = "Optional: give the work one final bounded round.";

          const choices = document.createElement("div");
          choices.className = "timer-choices";
          const running = document.createElement("div");
          running.className = "timer-row";
          running.hidden = true;

          let activeToggle = null;

          [["Five minutes", 300], ["Thirteen minutes", 780]].forEach(([label, dur]) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "timer-btn";
            btn.textContent = label;
            btn.addEventListener("click", () => {
              setReadout(readout, dur);
              activeToggle = attachToggle(dur, "Pause");
              activeToggle.dataset.mode = "running";
              startRun(dur, readout, note, activeToggle);
              note.textContent = "";
              choices.hidden = true;
              running.replaceChildren(activeToggle, readout, reset);
              running.hidden = false;
              reset.hidden = false;
            });
            choices.appendChild(btn);
          });

          reset.addEventListener("click", () => {
            stopTimer();
            resetBoundary();
            note.textContent = "";
            running.hidden = true;
            reset.hidden = true;
            choices.hidden = false;
          });

          wrap.append(lead, choices, running, note);
        }

        return wrap;
      }

      function bindFields() {
        content.querySelectorAll(".journal-fields textarea").forEach((field) => {
          const key = `aquarius-r13-${field.name}`;
          field.value = storage.get(key);
          field.addEventListener("input", () => {
            storage.set(key, field.value);
            const saved = field.parentElement.querySelector(".saved-note");
            saved.textContent = "Saved privately in this browser";
          });
        });
      }

      function paint() {
        square.classList.remove("resting");
        cover.setAttribute("aria-hidden", "true");
        stopTimer();
        resetBoundary();

        if (current === -1) {
          content.classList.add("title-sheet");
          content.replaceChildren(document.getElementById("title-sheet").content.cloneNode(true));
          content.querySelector("#beginRitual").addEventListener("click", () => goTo(0, "forward"));
          previous.disabled = true;
          next.querySelector("span").textContent = "Enter the square";
          status.textContent = "Threshold";
        } else {
          content.classList.remove("title-sheet");
          const item = cards[current];
          const copyTemplate = document.getElementById(`card-${current + 1}-copy`);
          const fieldTemplate = document.getElementById(`card-${current + 1}-fields`);
          const hasFields = fieldTemplate.content.querySelector("textarea") !== null;

          const number = document.createElement("p");
          number.className = "card-number";
          number.innerHTML = `The Thirteenth · Card <strong>${pad(current + 1)}</strong>`;

          const title = document.createElement("h1");
          title.className = "card-title";
          title.textContent = item.title;

          const copy = document.createElement("div");
          copy.className = "ritual-copy";
          copy.appendChild(copyTemplate.content.cloneNode(true));

          content.replaceChildren(number, title, copy);

          if (item.timer || item.timerOptional) {
            content.appendChild(buildTimer(item));
          }

          if (hasFields) {
            const journal = document.createElement("details");
            journal.className = "journal";
            journal.innerHTML = `
              <summary>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Record your notes</span>
              </summary>`;
            const fields = document.createElement("div");
            fields.className = "journal-fields";
            fields.appendChild(fieldTemplate.content.cloneNode(true));
            journal.appendChild(fields);
            content.appendChild(journal);
          }

          previous.disabled = false;
          next.querySelector("span").textContent = current === total - 1 ? "Set it to rest" : "Continue";

          bindFields();
        }

        status.textContent = current === -1 ? "Threshold" : cards[current].title;
        content.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
      }

      function goTo(target, direction) {
        if (animating || target === current || target < -1 || target > total - 1) return;

        if (reducedMotion.matches) {
          current = target;
          paint();
          return;
        }

        animating = true;
        content.classList.add("is-leaving");
        window.setTimeout(() => {
          current = target;
          paint();
          content.classList.remove("is-leaving");
          animating = false;
        }, 260);
      }

      function restAndReturn() {
        stopTimer();
        cover.setAttribute("aria-hidden", "false");
        square.classList.add("resting");
        showToast("Resting — the act was alive before reception arrived");
        window.setTimeout(() => { window.location.href = "../index.html"; }, reducedMotion.matches ? 900 : 2400);
      }

      previous.addEventListener("click", () => goTo(current - 1, "back"));

      next.addEventListener("click", () => {
        if (current === total - 1) {
          restAndReturn();
          return;
        }
        goTo(current + 1, "forward");
      });

      function collectedNotes() {
        const lines = ["THE CHILD IN THE SQUARE", "Full Moon in Aquarius · The Thirteenth", ""];
        cards.forEach((item, index) => {
          const fieldTemplate = document.getElementById(`card-${index + 1}-fields`);
          const fields = fieldTemplate.content.querySelectorAll("textarea");
          const values = [];
          fields.forEach((field) => {
            const value = storage.get(`aquarius-r13-${field.name}`).trim();
            if (value) values.push(`${field.previousElementSibling.textContent}\n${value}`);
          });
          if (values.length) lines.push(`CARD ${pad(index + 1)} · ${item.title.toUpperCase()}`, ...values, "");
        });
        return lines.join("\n");
      }

      document.getElementById("copyNotes").addEventListener("click", async () => {
        const text = collectedNotes();
        try {
          await navigator.clipboard.writeText(text);
          showToast("Notes copied");
        } catch (_) {
          showToast("Copy is unavailable in this browser");
        }
      });

      document.getElementById("exportNotes").addEventListener("click", () => {
        const blob = new Blob([collectedNotes()], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "aquarius-the-child-in-the-square-notes.txt";
        link.click();
        URL.revokeObjectURL(url);
        showToast("Notes exported");
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(sizeSquare, 120);
      });

      sizeSquare();
      paint();
    })();
  </script>
</body>
</html>
